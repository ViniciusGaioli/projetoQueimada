services:
    api:
        build: ./api
        container_name: api
        restart: unless-stopped
        environment:
          - MODELOS_DIR=/queimadas/out
        ports:
            - 5000:5000
        volumes:
            - ./api/out:/queimadas/out
    chamazero:
        build: .
        container_name: chamazero
        restart: unless-stopped
        ports:
            - 3000:3000
